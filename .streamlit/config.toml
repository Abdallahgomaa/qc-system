# إعدادات تطبيق CGES (البند 2.6)
# ---------------------------------------------------------------------------
# هذا الملف يُرفع إلى المستودع؛ ولا يحتوي أي سرّ.

[theme]
# الواجهة مصمّمة لتبدأ بالوضع الفاتح (يوجد زر «الوضع الداكن» داخل التطبيق
# يبدّل الألوان عبر CSS)، واللون الأساسي هو ذهبي الهوية المستخدم في
# اللوحتين الفاتحة والداكنة معاً.
base = "light"
primaryColor = "#B88A2E"

[server]
headless = true
# تقديم ملفات المجلد ./static (أيقونة التطبيق وmanifest الـPWA) — البند (أ)
enableStaticServing = true

[browser]
gatherUsageStats = false
